<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语境差 Context Gap · 出海文案语境校对</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --line:#d5dbe3; --soft:#f7f8fa;
    --text:#16202e; --muted:#4f5c6b; --accent:#2f4d7c;
    --pass:#2e7d5b; --warn:#9a6b1c; --danger:#a8443c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);padding:34px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header{margin-bottom:22px}
  .eyebrow{color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.12em;
           text-transform:uppercase;margin-bottom:10px}
  h1{font-size:34px;letter-spacing:.02em;font-weight:700}
  h1 small{font-size:15px;color:var(--muted);font-weight:400;margin-left:12px;letter-spacing:.08em}
  .sub{color:var(--muted);margin-top:9px;font-size:14px;line-height:1.7}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .stat{font-size:11.5px;color:var(--muted);background:var(--panel);
        border:1px solid var(--line);border-radius:4px;padding:5px 12px}
  .stat b{color:var(--accent);font-weight:600}
  .grid{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
  label{display:block;font-size:13px;font-weight:700;color:var(--text);margin:0 0 9px;
        letter-spacing:.02em;padding-left:10px;border-left:3px solid var(--accent)}
  textarea,select{
    width:100%;background:var(--soft);border:1px solid var(--line);border-radius:4px;
    color:var(--text);padding:12px 14px;font-size:14px;line-height:1.7;outline:none;font-family:inherit;
  }
  textarea{height:126px;resize:vertical}
  textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,77,124,.12)}
  .row{margin-bottom:16px}
  button.primary{
    width:100%;padding:13px;border:0;border-radius:4px;cursor:pointer;font-size:15px;font-weight:600;
    color:#ffffff;background:var(--accent);transition:background .2s;
  }
  button.primary:hover{background:#254064}
  .section{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .section>p{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:10px;
             line-height:1.6;padding-left:10px;border-left:3px solid var(--accent)}
  .chip{
    display:block;width:100%;text-align:left;margin-bottom:7px;padding:9px 11px;font-size:12.5px;
    color:var(--muted);background:var(--soft);border:1px solid var(--line);
    border-radius:4px;cursor:pointer;transition:.15s;font-family:inherit;line-height:1.5;
  }
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .badge{padding:7px 15px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.02em}
  .badge.pass{background:#eaf4ee;color:var(--pass);border:1px solid #bcd9c8}
  .badge.warn{background:#fbf3e2;color:var(--warn);border:1px solid #e6d2a8}
  .badge.danger{background:#fdecec;color:var(--danger);border:1px solid #e6c0bc}
  .meta{font-size:11.5px;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tag{font-size:11px;color:var(--accent);background:#eef2f8;
       border:1px solid #ccd7e6;border-radius:4px;padding:4px 9px}
  .tag.sig{color:var(--warn);background:#fbf3e2;border-color:#e6d2a8}
  .stance{border-left:3px solid var(--accent);background:var(--soft);
          border-radius:0 4px 4px 0;padding:10px 13px;margin-bottom:14px;font-size:12px;line-height:1.75}
  .stance b{display:block;color:var(--accent);font-size:12.5px;margin-bottom:3px}
  .stance span{color:var(--muted)}
  .conf{font-size:11.5px;line-height:1.7;color:#8a6118;background:#fbf3e2;
        border:1px solid #e6d2a8;border-radius:4px;padding:9px 12px;margin-bottom:14px}
  .block{margin-bottom:17px}
  .block h3{font-size:14.5px;font-weight:700;color:var(--accent);margin-bottom:10px;
            letter-spacing:.02em;display:flex;align-items:center;gap:9px}
  .block h3::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:1px}
  .block ul{list-style:none}
  .block li{font-size:13.5px;line-height:1.75;padding:8px 0 8px 16px;position:relative;
            border-bottom:1px dashed var(--line)}
  .block li:last-child{border-bottom:0}
  .block li::before{content:"\00b7";position:absolute;left:2px;color:var(--accent);font-weight:700}
  .block.risk h3,.block.risk li::before{color:var(--danger)}
  .block.risk h3::before{background:var(--danger)}
  .rewrite{font-size:14px;line-height:1.8;padding:14px 16px;border-radius:4px;
           background:var(--soft);border-left:3px solid var(--accent)}
  .empty{color:var(--muted);font-size:13px;line-height:1.7}
  details{border-top:1px solid var(--line);padding-top:13px;margin-top:4px}
  summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
  details a{display:block;color:var(--accent);font-size:12px;margin-top:9px;text-decoration:none;word-break:break-all;line-height:1.6}
  details a:hover{text-decoration:underline}
  .lib a{font-size:11.5px;color:var(--muted);display:block;margin-top:8px;line-height:1.6}
  .lib a:hover{color:var(--accent)}
  .actions{display:flex;gap:9px;margin-top:16px}
  .actions button{flex:1;padding:10px;font-size:12.5px;border-radius:4px;cursor:pointer;
    color:var(--text);background:var(--soft);border:1px solid var(--line);font-family:inherit}
  .actions button:hover{border-color:var(--accent);color:var(--accent)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:#243a5e;color:#ffffff;border:1px solid var(--accent);
    padding:10px 20px;border-radius:4px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  button.primary.done{background:var(--pass);color:#ffffff}
  button.primary:disabled{cursor:default}
  #result{scroll-margin-top:18px}
  #result.flash{animation:resultFlash 1.1s ease-out}
  @keyframes resultFlash{
    0%{box-shadow:0 0 0 2px rgba(47,77,124,.55);border-color:var(--accent);background:#eef2f8}
    70%{box-shadow:0 0 0 2px rgba(47,77,124,.22);border-color:var(--accent)}
    100%{box-shadow:0 0 0 0 rgba(47,77,124,0);border-color:var(--line);background:var(--panel)}
  }
  @media(prefers-reduced-motion:reduce){#result.flash{animation:none}}
  footer{margin-top:24px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">AI × 出海 · 知乎黑客松 S3</div>
    <h1>语境差 <small>Context Gap</small></h1>
    <p class="sub">不是翻译，也不是润色。把中文文案里那些<strong>因为太理所当然、所以从没被写下来的前提</strong>翻出来，并告诉你目标市场会怎么误读。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="grid">
    <section class="card">
      <div class="row">
        <label for="text">中文文案</label>
        <textarea id="text">白象，纯净可靠，值得信赖</textarea>
      </div>
      <div class="row">
        <label for="market">目标市场</label>
        <select id="market">
          <option value="欧美" selected>欧美 · 跨文化</option>
          <option value="中东">中东 · 异质文化圈</option>
          <option value="东南亚">东南亚 · 部分共通</option>
          <option value="港澳">港澳 · 同文化圈</option>
        </select>
      </div>
      <button class="primary" id="run">开始语境校对</button>

      <div class="section">
        <p>点样例，再切换市场看结论翻转</p>
        <div id="chips"></div>
      </div>

      <div class="section lib">
        <details>
          <summary>公开案例库（可溯源出处，<span id="libcount"></span> 条）</summary>
          <div id="lib"></div>
        </details>
      </div>
    </section>

    <section class="card" id="result">
      <div class="empty">左侧填入文案并选择市场，点「开始语境校对」。</div>
    </section>
  </div>

  <footer>
    规则引擎离线可用、结论可溯源 · 接入知乎开放平台与模型后自动增强<br>
    密钥仅存于后端环境变量，前端不可见
  </footer>
</div>
<div class="toast" id="toast"></div>

function marketView(rule, market){
  const m = rule.markets || {};
  if(m[market]) return m[market];                     // ① 该规则的精细分支（如欧美专属）
  const cls = rule.class || 'generic';
  const tone = (MARKETS.by_class[market] || {})[cls]; // ② 市场 × 类别 的判定基调
  if(tone) return tone;
  return m['default'] || {level:'warn', reading:'该类别暂无专项规则，建议人工复核。', fix:'把隐含语义明说出来，并请本地读者试读。'};
}

// 多条建议拼接：去掉各条自带句号、去重、用「；」连接，末尾只留一个句号
function joinFixes(arr){
  const clean = [...new Set(arr.filter(Boolean).map(s => String(s).replace(/[。；;\s]+$/,'').trim()))].filter(Boolean);
  return clean.length ? clean.slice(0,3).join('；') + '。' : '把省略的隐含语义明说出来，避免依赖读者自行脑补。';
}

function compose(hits, market){
  const views = hits.map(h => [h, marketView(h, market)]);
  const level = views.reduce((a,[,v]) => RANK[v.level] > RANK[a] ? v.level : a, 'pass');
  const premises = views.map(([h]) => h.premise).slice(0,4);
  // 多条同类规则会取到同一段「市场 × 类别」基调，必须去重，避免预警与改写重复堆叠
  const risks = [...new Set(views.map(([,v]) => v.reading))].slice(0,5);
  const fixes = [...new Set(views.map(([,v]) => v.fix).filter(Boolean))].slice(0,3);
  const faq = [...new Set(views.flatMap(([h]) => h.faq || []))].slice(0,3);
  const defaults = ['这句话具体想让我做什么？','有没有更直白的说法？','这个说法在本地常见吗？'];
  while(faq.length < 3) faq.push(defaults[faq.length]);
  const sources = [], seen = new Set();
  views.forEach(([h]) => (h.sources || []).forEach(s => {
    if(s.url && !seen.has(s.url)){ seen.add(s.url); sources.push(s); }
  }));
  return {
    level, premises: premises.length ? premises : GENERIC_PREMISES,
    risks, rewrite: joinFixes(fixes),
    faq, sources: sources.slice(0,6), matched: hits.map(h => h.id), engine:'rules'
  };
}

// —— 输入信号层：让「没命中规则」的文案也能得到随内容、随市场变化的结论 ——
function signalScore(sig, text){
  let score = 0, strong = false;
  (sig.contains || []).forEach(k => {
    if(text.includes(k)){ score += k.length >= 2 ? 3 : 1; if(k.length >= 2) strong = true; }
  });
  if(sig.regex){ try{ if(new RegExp(sig.regex).test(text)){ score += 3; strong = true; } }catch(e){} }
  const len = [...text].length;
  const lenHit = (sig.max_len !== undefined && len <= sig.max_len) ||
                 (sig.min_len !== undefined && len >= sig.min_len);
  if(lenHit) score += 1;
  return {score, strong, lenHit};
}

function detectSignals(text){
  const scored = SIGNALS.signals.map(s => ({s, ...signalScore(s, text)}))
    .filter(x => x.score > 0);
  // 优先「强信号」（双字以上关键词 / 正则）；单字偶然命中与纯长度信号降为兜底
  let picked = scored.filter(x => x.strong && x.score >= 2)
    .sort((a,b) => b.score - a.score).slice(0,4);
  if(!picked.length) picked = scored.filter(x => x.lenHit)
    .sort((a,b) => b.score - a.score).slice(0,1);
  return picked.map(x => x.s);
}

function composeSignals(hits, market){
  const tone = MARKETS.signal_tone[market] || {};
  const premises = [], risks = [], fixes = [], faq = [];
  let level = null;
  // 纯长度兜底：所有命中信号都没有内容关键词/正则（如 short/long），仅凭字数命中时
  // 只能提示信息不足，不能据此断言存在跨文化误读。
  const lenOnly = hits.length > 0 && hits.every(s => !(s.contains && s.contains.length) && !s.regex);
  if(lenOnly) risks.push('信息不足：仅凭句子长短无法判断具体传播风险，以下为通用提示，建议补充上下文并人工复核。');
  hits.forEach(s => {
    const cls = s.class || 'generic';
    const t = tone[cls] || tone.generic || {};
    (s.premises || []).slice(0,2).forEach(p => premises.push(p));  // 隐藏前提：中文文案自身默认了什么，与市场无关
    const own = (s.risks || []).filter(Boolean);
    if(own.length) own.slice(0,2).forEach(r => risks.push(r));      // 优先用该信号自身的精准风险，不再无条件套「意象/典故」通用模板
    else if(t.risk) risks.push(t.risk);                             // 仅当信号未配置自身风险时才回退市场基调
    const note = (s.market_notes || {})[market] || (s.market_notes || {})['default'];
    if(note) risks.push(note);                                       // 该类信号在该市场的具体提示
    if(s.fix) fixes.push(s.fix);                                  // 只保留该信号自身的针对性建议，不混入通用基调
    (s.faq || []).slice(0,1).forEach(f => faq.push(f));
    if(t.level && (level === null || RANK[t.level] > RANK[level])) level = t.level;
  });
  const dedup = a => [...new Set(a.filter(Boolean))];
  const defaults = ['这句话是写给谁看的？','有没有当地人更熟悉的说法？','哪些信息是我默认对方已经知道的？'];
  const faqOut = dedup(faq).slice(0,3);
  while(faqOut.length < 3) faqOut.push(defaults[faqOut.length]);
  return {
    level: level || 'warn',
    premises: dedup(premises).slice(0,4),
    risks: dedup(risks).slice(0,5),
    rewrite: joinFixes(fixes),
    faq: faqOut,
    sources:[], matched:[], signals: hits.map(s => s.label),
    engine:'rules', mode:'signal', confidence:'low',
    note:'低置信度推断，仅供参考，建议人工复核：未命中可溯源规则或外部出处，以下基于文案特征推断，不代表社区语料佐证。'
  };
}

function baselineResult(){
  const b = SIGNALS.baseline;
  return {
    level:'pass', premises:b.premises, risks:b.risks, rewrite:b.rewrite, faq:b.faq,
    sources:[], matched:[], signals:[], engine:'rules', mode:'baseline', confidence:'low',
    note:'未检测到可识别的营销信号 · 该文案跨文化传播风险一般较低，以下为通用核对建议。'
  };
}

// —— 中性商品 / 规格描述识别：靠结构特征，不靠穷举商品名 ——
// 有品牌后缀 / 规格 / 参数等结构，且没有实质营销话术与文化负载符号，就判为「具体商品描述」
function productStructHit(text){
  const P = SIGNALS.product;
  if(!P) return false;
  let t = text;
  (P.exclude || []).forEach(w => { t = t.split(w).join(''); });   // 先剔除「品牌/名牌…」这类误伤词
  if((P.hints || []).some(k => t.includes(k))) return true;
  try { return !!(P.regex && new RegExp(P.regex).test(t)); } catch(e){ return false; }
}
// 这些命中说明是营销/文化话术，不是中性商品描述。
// 不含 latin：「500ml / A4」这类规格单位里的字母是参数，不该被当成品牌名挡住商品描述识别
const HEAVY_SIGNALS = ['price','cta','address','classical','superlative','festival',
                       'emotion','symbol','health'];
function hasHeavySignal(sigs){ return sigs.some(s => HEAVY_SIGNALS.includes(s.id)); }

function productResult(market){
  const P = SIGNALS.product;
  const notes = P.market_notes || {};
  const note = notes[market] || notes['default'] || '';
  return {
    level: market === '港澳' ? 'pass' : 'warn',
    premises: P.premises,
    risks: [...P.risks, note].filter(Boolean),
    rewrite: P.rewrite,
    faq: P.faq,
    sources:[], matched:[], signals:[P.label],
    engine:'rules', mode:'product', confidence:'low', note:P.note
  };
}

function localAnalyze(text, market){
  for(const c of CASES){
    if(text.includes(c.match)){
      const hit = c.markets[market] || c.markets['default'];
      if(hit) return {...hit, matched:[c.id], signals:detectSignals(text).map(s=>s.label),
                      engine:'golden', mode:'preset', confidence:'high', market, text};
    }
  }
  const hits = RULES.filter(r => {
    if (r.keywords.some(k => text.includes(k))) return true;
    if (r.weak) for (const w of r.weak) {
      if (text.includes(w.kw) && w.anchors.some(a => text.includes(a))) return true;
    }
    return false;
  });
  if(hits.length) return {...compose(hits, market), signals:detectSignals(text).map(s=>s.label),
                          mode:'rules', confidence:'high', market, text};
  const sigs = detectSignals(text);
  if(productStructHit(text) && !hasHeavySignal(sigs)){
    return {...productResult(market), market, text};
  }
  const result = sigs.length ? composeSignals(sigs, market) : baselineResult();
  return {...result, market, text};
}

let CURRENT = null;

function list(items, cls){
  if(!items || !items.length) return '<div class="empty">无</div>';
  return '<ul>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
}

function render(d){
  CURRENT = d;
  const lv = LEVEL[d.level] ? d.level : 'warn';
  const prof = MARKETS.profiles[d.market] || {};
  const stance = prof.summary
    ? '<div class="stance"><b>' + esc(d.market) + ' · ' + esc(prof.stance) + '</b>' +
      '<span>' + esc(prof.summary) + '</span></div>' : '';
  const src = (d.sources || []).length
    ? '<details open><summary>依据来源（' + d.sources.length + ' 条，可溯源）</summary>' +
      d.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
        esc(s.title) + (s.snippet ? ' — ' + esc(s.snippet) : '') + '</a>').join('') + '</details>'
    : '<details><summary>依据来源：暂无外部出处</summary><div class="empty">' +
      '本结论来自内置规则设定或文案特征推断，未附可溯源资料或真实案例；' +
      (d.confidence === 'low' ? '置信度低，仅供参考，建议人工复核。' : '结论为规则设定，非已验证的文化事实，建议人工核实。') +
      '</div></details>';
  const tagHtml = [
    ...(d.matched || []).map(m => '<span class="tag">命中规则 ' + esc(m) + '</span>'),
    ...(d.signals || []).map(s => '<span class="tag sig">识别到 ' + esc(s) + '</span>')
  ].join('');
  const tags = tagHtml ? '<div class="tags">' + tagHtml + '</div>' : '';
  const conf = d.confidence === 'low'
    ? '<div class="conf">⚠ ' + esc(d.note || '以下为低置信度的规则推断，建议人工复核。') + '</div>' : '';
  $('result').innerHTML =
    '<div class="result-head"><span class="badge ' + lv + '">' + esc(LEVEL[lv]) + (d.confidence === 'low' ? ' · 低置信/仅供参考' : '') + '</span>' +
      '<span class="meta">' + esc(d.market || '') + ' · ' + esc(MODE[d.mode] || MODE[d.engine] || '') +
      (d.zhihu_linked ? ' · 已接入知乎语料' : '') + '</span></div>' +
    stance + conf + tags +
    '<div class="block"><h3>隐藏前提</h3>' + list(d.premises) + '</div>' +
    '<div class="block risk"><h3>误读预警</h3>' + list(d.risks) + '</div>' +
    '<div class="block"><h3>改写建议</h3><div class="rewrite">' + esc(d.rewrite || '（暂无）') + '</div></div>' +
    '<div class="block"><h3>对方最可能追问</h3>' + list(d.faq) + '</div>' +
    src +
    '<div class="actions"><button id="copyBtn">复制校对报告</button><button id="dlBtn">下载 .md 报告</button></div>';
  $('copyBtn').onclick = copyReport;
  $('dlBtn').onclick = downloadReport;
}

// 结论性质：区分「有外部出处」「无外部出处的内置规则」「仅信号推断」三种，避免把规则设定误标成案例库/已验证事实
function conclusionNature(d){
  if(d.confidence === 'low') return '信号推断（低置信度，仅供参考，建议人工复核；无外部出处）';
  const n = (d.sources || []).length;
  const base = d.mode === 'preset' ? '命中内置预设答案' : '命中内置规则';
  return n
    ? base + '，附 ' + n + ' 条外部出处'
    : base + '，暂无外部出处（结论为内置规则设定，非已验证的文化事实或真实案例，建议人工核实）';
}

function report(d){
  const li = a => (a || []).map(x => '- ' + x).join('\n') || '- 无';
  const prof = MARKETS.profiles[d.market] || {};
  return '# 语境差 · 出海文案语境校对报告\n\n' +
    '- 目标市场：' + d.market + (prof.stance ? '（' + prof.stance + '）' : '') + '\n' +
    '- 风险等级：' + LEVEL[d.level] + (d.confidence === 'low' ? '（低置信度推断，仅供参考，建议人工复核）' : '') + '\n- 原文案：' + d.text + '\n' +
    (prof.summary ? '- 市场关系：' + prof.summary + '\n' : '') +
    '- 命中规则：' + ((d.matched || []).join('、') || '无') + '\n' +
    '- 识别信号：' + ((d.signals || []).join('、') || '无') + '\n' +
    '- 分析引擎：' + (MODE[d.mode] || MODE[d.engine] || '') + '\n' +
    '- 结论性质：' + conclusionNature(d) + '\n\n' +
    (d.confidence === 'low' ? '> ' + (d.note || '') + '\n\n' : '') +
    '## 隐藏前提\n' + li(d.premises) + '\n\n## 误读预警\n' + li(d.risks) + '\n\n' +
    '## 改写建议\n' + (d.rewrite || '无') + '\n\n## 对方最可能追问\n' + li(d.faq) + '\n\n' +
    '## 依据来源\n' + ((d.sources || []).map(s => '- [' + s.title + '](' + s.url + ')').join('\n') || '- 暂无外部出处（基于内置规则设定 / 中文语境常识，非已验证文化事实）') + '\n';
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
async function copyReport(){
  const txt = report(CURRENT);
  try{ await navigator.clipboard.writeText(txt); toast('报告已复制到剪贴板'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('报告已复制');
  }
}
function downloadReport(){
  const blob = new Blob([report(CURRENT)], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '语境差_语境校对报告_' + CURRENT.market + '.md';
  a.click(); URL.revokeObjectURL(a.href); toast('报告已下载');
}

let DONE_TIMER = null;

function flashResult(){
  const box = $('result');
  box.classList.remove('flash');
  void box.offsetWidth;                 // 强制重排，保证连续点击时高亮动画能重播
  box.classList.add('flash');
  const r = box.getBoundingClientRect();
  const inView = r.top >= 0 && r.top < window.innerHeight * 0.75;
  if(!inView){                          // 结果不在眼前时，自动送到眼前
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    box.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
  }
}

function markGenerated(){
  const b = $('run');
  b.textContent = '已生成 ✅';
  b.classList.add('done');
  b.disabled = true;                    // 短暂禁用，防连点，也给一个明确的完成态
  clearTimeout(DONE_TIMER);
  DONE_TIMER = setTimeout(() => {
    b.textContent = '开始语境校对';
    b.classList.remove('done');
    b.disabled = false;
  }, 1500);
}

async function analyze(userTriggered){
  const text = $('text').value.trim(), market = $('market').value;
  if(!text){ $('result').innerHTML = '<div class="empty">请先输入一段中文文案。</div>'; return; }
  render(localAnalyze(text, market));   // 离线即刻出结果，路演绝不翻车
  if(userTriggered){ markGenerated(); flashResult(); }   // 结果一生成就送到眼前
  // 若部署在服务端且后端可用，静默用「知乎语料 + 模型」增强
  if(location.protocol.startsWith('http')){
    fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, market})})
      .then(r => r.ok ? r.json() : null).then(d => { if(d) render(d); }).catch(() => {});
  }
}

$('run').onclick = () => analyze(true);
$('market').onchange = () => analyze(true);

const libMap = new Map();
RULES.forEach(r => (r.sources || []).forEach(s => { if(s.url) libMap.set(s.url, s.title); }));
$('stats').innerHTML =
  '<span class="stat"><b>' + RULES.length + '</b> 条文化规则</span>' +
  '<span class="stat"><b>' + SIGNALS.signals.length + '</b> 类输入信号</span>' +
  '<span class="stat"><b>' + CASES.length + '</b> 个精选样例</span>' +
  '<span class="stat"><b>' + MARKETS.list.length + '</b> 个目标市场</span>' +
  '<span class="stat"><b>' + libMap.size + '</b> 条可溯源出处</span>' +
  '<span class="stat">零密钥 · 离线可用</span>';
$('libcount').textContent = libMap.size;
$('lib').innerHTML = [...libMap].map(([u,t]) =>
  '<a href="' + esc(u) + '" target="_blank" rel="noopener">▸ ' + esc(t) + '</a>').join('');
$('chips').innerHTML = SAMPLES.map(s =>
  '<button class="chip" data-t="' + esc(s) + '">▸ ' + esc(s) + '</button>').join('');
document.querySelectorAll('.chip').forEach(b => b.onclick = () => { $('text').value = b.dataset.t; analyze(true); });

analyze();   // 首屏默认展示，属初始化，不触发滚动与高亮
</script>
